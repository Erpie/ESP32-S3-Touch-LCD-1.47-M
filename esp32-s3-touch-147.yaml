          it.print(16, 18, id(font_title), id(color_white), TextAlign::CENTER_LEFT, "Switches");
          it.print(304, 18, id(font_info), id(color_light_gray), TextAlign::CENTER_RIGHT, "3/4");
          it.horizontal_line(16, 36, 288, id(color_gray));

          // BUTTON 5 (Left: x:30, y:50, w:114, h:80)
          bool s5 = id(switch_5).state;
          if (s5) {
            it.filled_rectangle(30, 50, 114, 80, id(color_btn_on_bg));
            it.rectangle(30, 50, 114, 80, id(color_white));
