          }

          auto ip = wifi::global_wifi_component->wifi_sta_ip_addresses();
          if (!ip.empty() && ip[0].is_set()) {
            char ip_buf[20];
            ip[0].str_to(ip_buf);
            it.print(16, 152, id(font_info), id(color_green), TextAlign::CENTER_LEFT, ip_buf);
          }
          auto time_now = id(ha_time).now();
