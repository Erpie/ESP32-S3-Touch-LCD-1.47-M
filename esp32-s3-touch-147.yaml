# Capacitive Touchscreen (AXS5106L)
touchscreen:
  - platform: axs5106
    id: my_touch
    i2c_id: bus_touch
    address: 0x63
    reset_pin: GPIO47
    display: my_display
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 172
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false

    on_release:
      - lambda: |-
          if (id(touch_active) && !id(gesture_handled)) {
            uint32_t duration = millis() - id(touch_start_time);
            if (duration < 600) {
              int tap_x = id(touch_start_x);
              int tap_y = id(touch_start_y);

              // Button area is y: 38 to 142 (Buttons are at y:50..130)
              if (tap_y >= 38 && tap_y <= 142) {
                // Left Button (x: 15 to 155)
                if (tap_x >= 15 && tap_x <= 155) {
                  switch (id(current_screen)) {
                    case 1: id(switch_1).toggle(); ESP_LOGI("touch", "Switch 1 toggled"); break;
                    case 2: id(switch_3).toggle(); ESP_LOGI("touch", "Switch 3 toggled"); break;
                    case 3: id(switch_5).toggle(); ESP_LOGI("touch", "Switch 5 toggled"); break;
                    case 4: id(switch_7).toggle(); ESP_LOGI("touch", "Switch 7 toggled"); break;
                  }
                }
                // Right Button (x: 165 to 305)
                else if (tap_x >= 165 && tap_x <= 305) {
                  switch (id(current_screen)) {
                    case 1: id(switch_2).toggle(); ESP_LOGI("touch", "Switch 2 toggled"); break;
                    case 2: id(switch_4).toggle(); ESP_LOGI("touch", "Switch 4 toggled"); break;
                    case 3: id(switch_6).toggle(); ESP_LOGI("touch", "Switch 6 toggled"); break;
                    case 4: id(switch_8).toggle(); ESP_LOGI("touch", "Switch 8 toggled"); break;
                  }
                }
              }
              // If tap is in the header (y < 35) or bottom dots (y > 145), tap left/right to navigate
              else if (tap_y > 145 || tap_y < 35) {
                if (tap_x > 160) {
                  id(current_screen) = (id(current_screen) % 4) + 1;
                } else {
                  id(current_screen) = (id(current_screen) == 1) ? 4 : (id(current_screen) - 1);
                }
                switch (id(current_screen)) {
                  case 1: id(my_display).show_page(page_1_switches); break;
                  case 2: id(my_display).show_page(page_2_switches); break;
                  case 3: id(my_display).show_page(page_3_switches); break;
                  case 4: id(my_display).show_page(page_4_switches); break;
                }
              }
            }
          }
          id(touch_active) = false;
          id(gesture_handled) = false;
          ESP_LOGI("touch", "Touch released");

    on_update:
      - lambda: |-
          if (touches.empty()) return;
          
          if (id(is_booting)) return;

          // Reset 1-minute inactivity timer on any touch
          id(last_activity_time) = millis();

          // If backlight was auto-dimmed to 0%, smoothly wake it up!
          if (id(screen_is_dimmed)) {
            id(screen_is_dimmed) = false;
            auto call = id(lcd_backlight).turn_on();
            call.set_transition_length(300); // 300ms wake
            call.perform();
            id(gesture_handled) = true; // Consume touch to prevent accidental button toggle
            ESP_LOGI("display", "Backlight woken up by touch");
            return;
          }
          
          auto &t = touches[0];
          
          if (!id(touch_active)) {
            id(touch_active) = true;
            id(touch_start_x) = t.x;
            id(touch_start_y) = t.y;
            id(touch_start_time) = millis();
            id(gesture_handled) = false;
            ESP_LOGI("touch", "Touch down at (%d, %d)", t.x, t.y);
            return;
          }
          
          if (id(gesture_handled)) return;
          
          int total_dx = t.x - id(touch_start_x);
          int total_dy = t.y - id(touch_start_y);
          
          // Swipe right-to-left (dx < -30) -> Next screen
          if (total_dx < -30 && abs(total_dy) < 80) {
            id(gesture_handled) = true;
            id(current_screen) = (id(current_screen) % 4) + 1;
            ESP_LOGI("touch", "Swipe Left -> Screen %d", id(current_screen));
            switch (id(current_screen)) {
              case 1: id(my_display).show_page(page_1_switches); break;
              case 2: id(my_display).show_page(page_2_switches); break;
              case 3: id(my_display).show_page(page_3_switches); break;
              case 4: id(my_display).show_page(page_4_switches); break;
            }
          }
          // Swipe left-to-right (dx > 30) -> Prev screen
          else if (total_dx > 30 && abs(total_dy) < 80) {
            id(gesture_handled) = true;
            id(current_screen) = (id(current_screen) == 1) ? 4 : (id(current_screen) - 1);
            ESP_LOGI("touch", "Swipe Right -> Screen %d", id(current_screen));
            switch (id(current_screen)) {
              case 1: id(my_display).show_page(page_1_switches); break;
              case 2: id(my_display).show_page(page_2_switches); break;
              case 3: id(my_display).show_page(page_3_switches); break;
              case 4: id(my_display).show_page(page_4_switches); break;
            }
          }
